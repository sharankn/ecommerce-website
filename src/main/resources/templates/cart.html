<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Shopping Cart</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

th,td{
    border:1px solid #ddd;
    padding:15px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.btn{
    background:red;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
}

.qtybtn{
    width:30px;
    height:30px;
    font-size:18px;
    cursor:pointer;
}

.checkout{
    background:green;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

.home{
    margin-bottom:20px;
}

</style>

</head>

<body>

<h1>🛒 Shopping Cart</h1>

<div class="home">
    <a href="/">⬅ Continue Shopping</a>
</div>

<table>

<tr>
    <th>Image</th>
    <th>Product</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Total</th>
    <th>Action</th>
</tr>

<tr th:each="item : ${cartItems}">

    <td>
        <img th:src="@{/images/{img}(img=${item.image})}">
    </td>

    <td th:text="${item.productName}"></td>

    <td>
        ₹ <span th:text="${item.price}"></span>
    </td>

    <td>

        <a th:href="@{/cart/decrease(id=${item.cartId})}">
            <button class="qtybtn">-</button>
        </a>

        <span style="padding:0 12px;font-weight:bold;"
              th:text="${item.quantity}">
        </span>

        <a th:href="@{/cart/increase(id=${item.cartId})}">
            <button class="qtybtn">+</button>
        </a>

    </td>

    <td>
        ₹ <span th:text="${item.price * item.quantity}"></span>
    </td>

    <td>
        <a th:href="@{/cart/remove(id=${item.cartId})}">
            <button class="btn">Remove</button>
        </a>
    </td>

</tr>

</table>

<br><br>

<div style="text-align:right;font-size:28px;font-weight:bold;">
    Grand Total :
    ₹ <span th:text="${grandTotal}"></span>
</div>

<br>

<div style="text-align:right;">
    <button class="checkout">
        Checkout
    </button>
</div>

</body>
</html>
